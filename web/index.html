<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Voxel Dioramas</title>
  <meta name="description" content="Procedural micro-voxel dioramas rendered with WebGPU.">
  <meta name="theme-color" content="#0f1a36">
  <!-- Add to Home Screen: launch full screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dioramas">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(12, 18, 36, 0.72);
      --panel-border: rgba(255, 255, 255, 0.14);
      --text: #f2f5fb;
      --muted: #aab4c8;
      --accent: #ffcf5a;
    }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    canvas#scene-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block;
      touch-action: none; outline: none;
    }
    .status {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: radial-gradient(ellipse at center, rgba(15, 26, 54, 0.82), rgba(5, 8, 20, 0.92));
      font-size: 17px; z-index: 5;
    }
    .status[hidden] { display: none; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.18); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    .status.error .spinner { display: none; }
    .status .note { color: var(--muted); font-size: 14px; max-width: 520px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="scene-canvas" tabindex="0" aria-label="3D diorama"></canvas>

  <div class="status" id="status" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div id="status-text">Loading...</div>
    <div class="note" id="status-note"></div>
  </div>



  <script>
    // Hooks called from Rust (engine/platform.rs).
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const statusNote = document.getElementById('status-note');
    globalThis.voxelHud = () => {};  // the in-app UI shows status
    globalThis.voxelStatus = (text) => {
      statusEl.hidden = !text;
      statusText.textContent = text;
      if (text.startsWith('Generating')) {
        statusNote.textContent = 'The world is generated from math on this device. This can take several seconds.';
      } else {
        statusNote.textContent = '';
      }
    };
    globalThis.voxelError = (title, note) => {
      statusEl.hidden = false;
      statusEl.classList.add('error');
      statusText.textContent = title;
      statusNote.textContent = note;
    };
    window.addEventListener('error', (e) => voxelError('Something went wrong.', String(e.message || e.error)));
    window.addEventListener('unhandledrejection', (e) => voxelError('Something went wrong.', String(e.reason)));
  </script>
  <script type="module">
    if (!('gpu' in navigator)) {
      voxelError(
        'This browser does not support WebGPU.',
        'Use a current Safari (iPadOS / iOS / macOS 26 or newer), Chrome or Edge. On older iPadOS, ' +
        'WebGPU can be enabled in Settings › Apps › Safari › Advanced › Feature Flags.'
      );
    } else {
      const wasm = await import('./pkg/dioramas.js');
      await wasm.default();          // instantiates the module and runs web_start()
      const canvas = document.getElementById('scene-canvas');
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      canvas.addEventListener('pointerdown', () => canvas.focus());
      canvas.focus();
    }
  </script>

</body>
</html>
