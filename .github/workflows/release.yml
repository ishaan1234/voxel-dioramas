name: Release (desktop + web downloads)

# Push a tag like v0.2.0 to build Windows, macOS and Linux apps plus a
# static web build, and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: voxel-dioramas-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: voxel-dioramas-macos-apple-silicon
          - os: macos-latest   # cross-compiles for Intel Macs
            target: x86_64-apple-darwin
            name: voxel-dioramas-macos-intel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: voxel-dioramas-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin voxel-dioramas --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/voxel-dioramas.exe pkg/
          Copy-Item README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.name }}.zip
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/voxel-dioramas pkg/
          cp README.md LICENSE pkg/
          tar -czf ${{ matrix.name }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: bash scripts/build-web.sh
      - run: cd dist && zip -r ../voxel-dioramas-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: voxel-dioramas-web
          path: voxel-dioramas-web.zip

  publish:
    needs: [desktop, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
